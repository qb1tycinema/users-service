version: "3.9"

services:
  users-service:
    container_name: users-service
    image: qb1tycinema/users-service:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production.local
    expose:
      - "9102"
    volumes:
      - ../docker/logs/users:/var/log/services/users
    networks:
      - qb1tycinema

networks:
  qb1tycinema:
    external: true